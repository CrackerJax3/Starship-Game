<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>SpaceX Starship Lander Game (Unofficial)</title>
	<style>
		* {
			margin: 0;
			overflow: hidden;
			-webkit-touch-callout: none;
			-webkit-user-callout: none;
			-webkit-user-select: none;
			-webkit-user-drag: none;
			-webkit-user-modify: none;
			-webkit-highlight: none;
			-ms-user-select: none;
			user-select: none;
			box-sizing: border-box;
		}

		.overlay {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.82);
			z-index: 10;
			overflow: visible;
		}

		.overlay-box {
			background: rgba(10, 20, 40, 0.97);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 12px;
			padding: 40px 48px;
			text-align: center;
			color: #fff;
			font-family: 'Trebuchet MS', sans-serif;
			max-width: 420px;
			width: 90%;
			overflow: visible;
		}

		.overlay-box h1 {
			font-size: 1.8em;
			margin-bottom: 8px;
			letter-spacing: 1px;
		}

		.overlay-box h2 {
			font-size: 1.5em;
			margin-bottom: 16px;
		}

		.overlay-box p {
			font-size: 0.95em;
			color: rgba(255, 255, 255, 0.65);
			margin-bottom: 20px;
		}

		.overlay-box input[type="text"] {
			width: 100%;
			padding: 10px 14px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 6px;
			color: #fff;
			outline: none;
			margin-bottom: 16px;
			user-select: text;
			-webkit-user-select: text;
			overflow: visible;
		}

		.overlay-box input[type="text"]::placeholder {
			color: rgba(255, 255, 255, 0.3);
		}

		.overlay-box input[type="text"]:focus {
			border-color: rgba(255, 255, 255, 0.55);
		}

		.btn {
			padding: 10px 28px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.3);
			border-radius: 6px;
			color: #fff;
			cursor: pointer;
			transition: background 0.15s;
			margin: 4px;
		}

		.btn:hover {
			background: rgba(255, 255, 255, 0.22);
		}

		.btn-primary {
			background: rgba(29, 115, 255, 0.55);
			border-color: rgba(29, 115, 255, 0.8);
		}

		.btn-primary:hover {
			background: rgba(29, 115, 255, 0.75);
		}

		#scoreboard-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
			font-size: 0.95em;
		}

		#scoreboard-table th {
			color: rgba(255, 255, 255, 0.5);
			font-weight: normal;
			padding: 4px 8px;
			text-align: left;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		#scoreboard-table td {
			padding: 6px 8px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.06);
		}

		#scoreboard-table tr.highlight td {
			color: #ffd700;
			font-weight: bold;
		}

		#scoreboard-status {
			color: rgba(255, 255, 255, 0.45);
			font-size: 0.85em;
			margin-bottom: 12px;
		}

		/* ── AdSense left banner ── */
		:root {
			--ad-width: 160px;
			--ad-height: min(600px, 80vh);
			--toggle-width: 32px;
			--toggle-font: 22px;
		}

		@media (max-width: 767px) {
			:root {
				--ad-width: 120px;
				--ad-height: min(480px, 70vh);
				--toggle-width: 44px;   /* meets touch target minimum */
				--toggle-font: 26px;
			}
		}

		#ad-panel {
			position: fixed;
			top: 50%;
			left: 0;
			transform: translateY(-50%);
			z-index: 20;
			transition: transform 0.3s ease;
			display: flex;
			align-items: stretch;
		}

		#ad-panel.collapsed {
			transform: translateY(-50%) translateX(calc(-1 * var(--ad-width)));
		}

		#ad-content {
			width: var(--ad-width);
			height: var(--ad-height);
			background: rgba(5, 12, 28, 0.92);
			border-right: 1px solid rgba(255, 255, 255, 0.12);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
			overflow: hidden;
		}

		#ad-toggle {
			width: var(--toggle-width);
			min-height: 80px;
			background: rgba(29, 115, 255, 0.35);
			border: 1px solid rgba(29, 115, 255, 0.6);
			border-left: none;
			border-radius: 0 8px 8px 0;
			color: #fff;
			font-size: var(--toggle-font);
			font-weight: bold;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
			user-select: none;
			padding: 16px 0;
			transition: background 0.15s;
		}

		#ad-toggle:hover {
			background: rgba(29, 115, 255, 0.65);
		}

		#ad-toggle .arrow {
			display: inline-block;
			line-height: 1;
			transition: transform 0.3s ease;
		}

		#ad-panel.collapsed #ad-toggle .arrow {
			transform: rotate(180deg);
		}
	</style>
	<!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your AdSense publisher ID -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <script type="module" crossorigin src="/Starship-Game/assets/index-C6exBzoC.js"></script>
</head>

<body>
	<!-- AdSense collapsible left banner -->
	<div id="ad-panel">
		<div id="ad-content">
			<!-- Replace data-ad-client and data-ad-slot with your own values -->
			<ins class="adsbygoogle"
				style="display:block;width:100%;height:100%"
				data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
				data-ad-slot="XXXXXXXXXX"
				data-ad-format="auto"
				data-full-width-responsive="true"></ins>
		</div>
		<div id="ad-toggle" title="Toggle ad"><span class="arrow">&#9664;</span></div>
	</div>
	<script>
		(function () {
			var panel = document.getElementById('ad-panel');
			var toggle = document.getElementById('ad-toggle');
			// Default: collapsed on mobile, expanded on desktop
			var stored = localStorage.getItem('adPanelCollapsed');
			var isMobile = window.innerWidth < 768;
			var collapsed = stored !== null ? stored === 'true' : isMobile;
			if (collapsed) panel.classList.add('collapsed');
			toggle.addEventListener('click', function () {
				panel.classList.toggle('collapsed');
				localStorage.setItem('adPanelCollapsed', panel.classList.contains('collapsed'));
			});
			try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
		})();
	</script>

	<!-- Name entry overlay — shown on first visit -->
	<div id="overlay-name" class="overlay">
		<div class="overlay-box">
			<h1>Starship Lander</h1>
			<p>Enter your callsign to appear on the global leaderboard.</p>
			<input type="text" id="player-name-input" maxlength="20" placeholder="Your callsign..." autocomplete="off" />
			<br>
			<button class="btn btn-primary" id="play-btn">Play</button>
		</div>
	</div>

	<!-- Scoreboard overlay — shown after winning -->
	<div id="overlay-scoreboard" class="overlay" style="display:none">
		<div class="overlay-box">
			<h2>🏆 Leaderboard</h2>
			<p id="scoreboard-status">Loading scores…</p>
			<table id="scoreboard-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Name</th>
						<th>Time</th>
					</tr>
				</thead>
				<tbody id="scoreboard-body"></tbody>
			</table>
			<button class="btn btn-primary" id="close-scoreboard-btn">Play Again</button>
		</div>
	</div>
</body>

</html>
