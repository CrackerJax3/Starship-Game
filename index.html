<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>SpaceX Starship Lander Game (Unofficial)</title>
	<style>
		* {
			margin: 0;
			overflow: hidden;
			-webkit-touch-callout: none;
			-webkit-user-callout: none;
			-webkit-user-select: none;
			-webkit-user-drag: none;
			-webkit-user-modify: none;
			-webkit-highlight: none;
			-ms-user-select: none;
			user-select: none;
			box-sizing: border-box;
			touch-action: none;
		}

		html, body {
			overscroll-behavior: none;
			overscroll-behavior-y: none;
			position: fixed;
			width: 100%;
			height: 100%;
			background: #000;
		}

		.overlay {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.82);
			z-index: 10;
			overflow: visible;
		}

		.overlay-box {
			background: rgba(10, 20, 40, 0.97);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 12px;
			padding: 40px 48px;
			text-align: center;
			color: #fff;
			font-family: 'Trebuchet MS', sans-serif;
			max-width: 420px;
			width: 90%;
			overflow: visible;
		}

		.overlay-box h1 {
			font-size: 1.8em;
			margin-bottom: 8px;
			letter-spacing: 1px;
		}

		.overlay-box h2 {
			font-size: 1.5em;
			margin-bottom: 16px;
		}

		.overlay-box p {
			font-size: 0.95em;
			color: rgba(255, 255, 255, 0.65);
			margin-bottom: 20px;
		}

		.overlay-box input[type="text"] {
			width: 100%;
			padding: 10px 14px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 6px;
			color: #fff;
			outline: none;
			margin-bottom: 16px;
			user-select: text;
			-webkit-user-select: text;
			overflow: visible;
		}

		.overlay-box input[type="text"]::placeholder {
			color: rgba(255, 255, 255, 0.3);
		}

		.overlay-box input[type="text"]:focus {
			border-color: rgba(255, 255, 255, 0.55);
		}

		.btn {
			padding: 10px 28px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.3);
			border-radius: 6px;
			color: #fff;
			cursor: pointer;
			transition: background 0.15s;
			margin: 4px;
		}

		.btn:hover {
			background: rgba(255, 255, 255, 0.22);
		}

		.btn-primary {
			background: rgba(29, 115, 255, 0.55);
			border-color: rgba(29, 115, 255, 0.8);
		}

		.btn-primary:hover {
			background: rgba(29, 115, 255, 0.75);
		}

		#scoreboard-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
			font-size: 0.95em;
		}

		#scoreboard-table th {
			color: rgba(255, 255, 255, 0.5);
			font-weight: normal;
			padding: 4px 8px;
			text-align: left;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		#scoreboard-table td {
			padding: 6px 8px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.06);
		}

		#scoreboard-table tr.highlight td {
			color: #ffd700;
			font-weight: bold;
		}

		#scoreboard-status {
			color: rgba(255, 255, 255, 0.45);
			font-size: 0.85em;
			margin-bottom: 12px;
		}

		/* Burger menu button */
		#burger-btn {
			position: fixed;
			top: 14px;
			right: 14px;
			z-index: 20;
			width: 44px;
			height: 44px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 6px;
			background: rgba(10, 20, 40, 0.72);
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 8px;
			cursor: pointer;
			padding: 0;
			transition: background 0.15s;
		}
		#burger-btn:hover {
			background: rgba(10, 20, 40, 0.92);
		}
		#burger-btn span {
			display: block;
			width: 22px;
			height: 2px;
			background: #fff;
			border-radius: 2px;
		}

		/* Pause menu overlay */
		#overlay-pause {
			z-index: 15;
		}
		#overlay-pause .overlay-box {
			min-width: 300px;
		}
		#overlay-pause h2 {
			font-size: 1.4em;
			margin-bottom: 20px;
			letter-spacing: 1px;
		}
		#pause-scoreboard-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
			font-size: 0.95em;
		}
		#pause-scoreboard-table th {
			color: rgba(255, 255, 255, 0.5);
			font-weight: normal;
			padding: 4px 8px;
			text-align: left;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}
		#pause-scoreboard-table td {
			padding: 6px 8px;
			border-bottom: 1px solid rgba(255, 255, 255, 0.06);
		}
		#pause-scoreboard-table tr.highlight td {
			color: #ffd700;
			font-weight: bold;
		}
		#pause-scoreboard-status {
			color: rgba(255, 255, 255, 0.45);
			font-size: 0.85em;
			margin-bottom: 12px;
		}
		.pause-menu-buttons {
			display: flex;
			flex-direction: row;
			gap: 6px;
			justify-content: center;
		}
		.pause-menu-buttons .btn {
			flex: 1;
			margin: 0;
			padding: 10px 4px;
			font-size: clamp(0.6rem, 2.8vw, 0.9rem);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			text-align: center;
		}

		/* Scoreboard action buttons row */
		.scoreboard-buttons {
			display: flex;
			gap: 8px;
			justify-content: center;
		}
		.scoreboard-buttons .btn {
			flex: 1;
			margin: 0;
		}

		/* World Record banner */
		@keyframes wr-pulse {
			0%, 100% { transform: scale(1); opacity: 1; }
			50% { transform: scale(1.06); opacity: 0.85; }
		}
		#wr-banner {
			background: linear-gradient(135deg, rgba(255,215,0,0.18), rgba(255,140,0,0.18));
			border: 1px solid rgba(255,215,0,0.6);
			border-radius: 8px;
			padding: 10px 16px;
			margin-bottom: 16px;
			animation: wr-pulse 1.2s ease-in-out infinite;
		}
		#wr-title {
			font-size: 1.1em;
			font-weight: bold;
			color: #ffd700;
			letter-spacing: 1px;
			margin: 0;
		}

		/* Share sub-menu */
		#share-menu {
			margin-top: 4px;
			display: none;
			flex-direction: column;
			gap: 8px;
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.1);
			border-radius: 8px;
			padding: 12px;
		}
		#share-menu.open {
			display: flex;
		}
		#share-menu p {
			font-size: 0.8em;
			margin-bottom: 4px;
			color: rgba(255,255,255,0.5);
		}
		.share-links {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			justify-content: center;
		}
		.share-links a {
			display: inline-block;
			padding: 7px 14px;
			font-size: 0.88em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255,255,255,0.10);
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 6px;
			color: #fff;
			text-decoration: none;
			cursor: pointer;
			transition: background 0.15s;
		}
		.share-links a:hover {
			background: rgba(255,255,255,0.22);
		}
	</style>
	<script type="module" src="./main.js"></script>
</head>

<body>
	<!-- Ad loading overlay — shown while an ad is fetching -->
	<div id="overlay-ad-loading" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.78);align-items:center;justify-content:center;flex-direction:column;gap:14px;">
		<div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.75);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
		<div style="color:rgba(255,255,255,0.65);font-family:'Trebuchet MS',sans-serif;font-size:0.9em;letter-spacing:0.5px;">Loading ad…</div>
	</div>
	<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

	<!-- Burger menu button -->
	<button id="burger-btn" aria-label="Menu">
		<span></span>
		<span></span>
		<span></span>
	</button>

	<!-- Pause menu overlay (burger) -->
	<div id="overlay-pause" class="overlay" style="display:none">
		<div class="overlay-box">
			<h2>🏆 Leaderboard</h2>
			<p id="pause-scoreboard-status">Loading scores…</p>
			<table id="pause-scoreboard-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Name</th>
						<th>Time</th>
						<th>Flights</th>
					</tr>
				</thead>
				<tbody id="pause-scoreboard-body"></tbody>
			</table>
			<div class="pause-menu-buttons">
				<button class="btn" id="pause-restart-btn">Restart</button>
				<button class="btn" id="pause-username-btn">Callsign</button>
				<button class="btn" id="pause-share-btn">Share</button>
				<button class="btn btn-primary" id="pause-resume-btn">Continue</button>
			</div>
		</div>
	</div>

	<!-- Name entry overlay — shown on first visit -->
	<div id="overlay-name" class="overlay">
		<div class="overlay-box">
			<h1>Starship Lander</h1>
			<p>Enter your callsign to appear on the global leaderboard.</p>
			<input type="text" id="player-name-input" maxlength="20" placeholder="Your callsign..." autocomplete="off" />
			<br>
			<button class="btn btn-primary" id="play-btn">Play</button>
		</div>
	</div>

	<!-- Scoreboard overlay — shown after winning -->
	<div id="overlay-scoreboard" class="overlay" style="display:none">
		<div class="overlay-box">
			<div id="wr-banner" style="display:none">
				<p id="wr-title">🌍 NEW WORLD RECORD!</p>
			</div>
			<h2>🏆 Leaderboard</h2>
			<p id="scoreboard-status">Loading scores…</p>
			<table id="scoreboard-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Name</th>
						<th>Time</th>
						<th>Flights</th>
					</tr>
				</thead>
				<tbody id="scoreboard-body"></tbody>
			</table>
			<div class="scoreboard-buttons">
				<button class="btn" id="scoreboard-share-btn">Share</button>
				<button class="btn btn-primary" id="close-scoreboard-btn">Play Again</button>
			</div>
		</div>
	</div>
</body>

</html>
