<!DOCTYPE html>

	<style>

			justify-content: center;

			z-index: 10;
			overflow: visible;

		.overlay-box {

			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 12px;
			padding: 40px 48px;
			text-align: center;
			color: #fff;
			font-family: 'Trebuchet MS', sans-serif;
			max-width: 420px;
			width: 90%;
			overflow: visible;
		}

		.overlay-box h1 {
			font-size: 1.8em;
			margin-bottom: 8px;
			letter-spacing: 1px;

		.overlay-box h2 {

		}

		.overlay-box p {
			font-size: 0.95em;
			color: rgba(255, 255, 255, 0.65);
			margin-bottom: 20px;
		}

		.overlay-box input[type="text"] {
			width: 100%;
			padding: 10px 14px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 6px;
			color: #fff;
			outline: none;
			margin-bottom: 16px;
			user-select: text;
			-webkit-user-select: text;
			overflow: visible;
		}

		.overlay-box input[type="text"]::placeholder {
			color: rgba(255, 255, 255, 0.3);
		}

		.overlay-box input[type="text"]:focus {
			border-color: rgba(255, 255, 255, 0.55);
		}

		.btn {
			padding: 10px 28px;
			font-size: 1em;
			font-family: 'Trebuchet MS', sans-serif;
			background: rgba(255, 255, 255, 0.12);
			border: 1px solid rgba(255, 255, 255, 0.3);
			border-radius: 6px;
			color: #fff;
			cursor: pointer;
			transition: background 0.15s;
			margin: 4px;

		.btn:hover {

		}

		#scoreboard-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 20px;
			font-size: 0.95em;
		}

		#scoreboard-table th {
			color: rgba(255, 255, 255, 0.5);
			font-weight: normal;
			padding: 4px 8px;
			text-align: left;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);

<body>
	<!-- Name entry overlay — shown on first visit -->
	<div id="overlay-name" class="overlay">
		<div class="overlay-box">
			<h1>Starship Lander</h1>
			<p>Enter your callsign to appear on the global leaderboard.</p>
			<input type="text" id="player-name-input" maxlength="20" placeholder="Your callsign..." autocomplete="off" />
			<br>
			<button class="btn btn-primary" id="play-btn">Play</button>
		</div>
	</div>

	<div id="overlay-scoreboard" class="overlay" style="display:none">
		<div class="overlay-box">
			<h2>🏆 Leaderboard</h2>
			<p id="scoreboard-status">Loading scores…</p>
			<table id="scoreboard-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Name</th>
						<th>Time</th>
					</tr>
				</thead>
				<tbody id="scoreboard-body"></tbody>
			</table>
			<button class="btn btn-primary" id="close-scoreboard-btn">Play Again</button>
		</div>
	</div>
</body>

</html>
